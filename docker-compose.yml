services:

  postgres:
    image: postgres:17
    container_name: maje-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: maje
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend

    container_name: hardynatta-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    # Docker networking override.
    # backend/.env keeps localhost for host-side development,
    # while the backend container reaches PostgreSQL through
    # the Compose service name "postgres".
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/maje

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app


volumes:
  postgres_data:
